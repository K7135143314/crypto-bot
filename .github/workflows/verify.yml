name: Verify scanner

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: read-only-scanner
  cancel-in-progress: false

jobs:
  typecheck-and-live-read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Read-only Base quote matrix
        run: npm run scan
      - name: Publish run summary
        run: cat artifacts/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload scan report
        uses: actions/upload-artifact@v4
        with:
          name: scan-report-${{ github.run_number }}
          path: |
            artifacts/latest-scan.json
            artifacts/summary.md
          if-no-files-found: error
          retention-days: 30
      - name: Upload candidate report when present
        uses: actions/upload-artifact@v4
        with:
          name: candidate-report-${{ github.run_number }}
          path: artifacts/candidates.json
          if-no-files-found: ignore
          retention-days: 30
