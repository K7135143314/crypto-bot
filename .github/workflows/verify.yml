name: Verify scanner

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: read-only-scanner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  typecheck-and-live-read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Generate V0.8 pinned scanner plan
        env:
          BASE_FORK_BLOCK: '52216060'
          BASE_RPC_URL: https://mainnet.base.org
        run: npm run simulation:plan

      - name: Install isolated V0.8 fork simulator
        run: npm install --prefix simulation

      - name: Run V0.8 pinned Base fork proof
        env:
          BASE_FORK_BLOCK: '52216060'
          BASE_FORK_RPC_URL: https://mainnet.base.org
        run: npm --prefix simulation test

      - name: Compare scanner estimate with atomic fork
        run: npm run simulation:compare

      - name: Prove synthetic candidate detection
        run: npm run proof:candidate

      - name: Read-only Base quote matrix
        run: npm run scan

      - name: Fetch previous scan baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100"               --jq '.artifacts[]
                | select(.expired == false)
                | select(.name | startswith("scan-report-"))
                | .id'               | sed -n '1p'
          )"

          if [ -z "${artifact_id}" ]; then
            echo "No previous scan artifact found; trend will start with NO_BASELINE."
            exit 0
          fi

          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/previous-scan.zip
          mkdir -p /tmp/previous-scan
          unzip -q /tmp/previous-scan.zip -d /tmp/previous-scan

          if [ -f /tmp/previous-scan/latest-scan.json ]; then
            cp /tmp/previous-scan/latest-scan.json artifacts/previous-scan.json
            echo "Previous scan baseline restored."
          else
            echo "Previous artifact did not contain latest-scan.json; trend will use NO_BASELINE."
          fi

      - name: Compare with previous scan
        run: npm run compare -- artifacts/previous-scan.json artifacts/latest-scan.json

      - name: Fetch rolling history baselines
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/history
          cp artifacts/latest-scan.json artifacts/history/current.json

          mapfile -t artifact_ids < <(
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100"               --jq '.artifacts[]
                | select(.expired == false)
                | select(.name | startswith("scan-report-"))
                | .id'               | sed -n '1,5p'
          )

          index=1
          for artifact_id in "${artifact_ids[@]}"; do
            zip_path="/tmp/history-${index}.zip"
            dir_path="/tmp/history-${index}"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${zip_path}"
            mkdir -p "${dir_path}"
            unzip -q "${zip_path}" -d "${dir_path}"
            if [ -f "${dir_path}/latest-scan.json" ]; then
              cp "${dir_path}/latest-scan.json" "artifacts/history/previous-${index}.json"
            fi
            index=$((index + 1))
          done

          echo "Rolling history sample files:"
          ls -1 artifacts/history

      - name: Analyze rolling history
        run: npm run history -- artifacts/history

      - name: Analyze paper candidate persistence
        run: npm run paper -- artifacts/history

      - name: Publish run summary
        run: |
          cat artifacts/summary.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/trend.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/rolling-history.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/paper-persistence.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan report
        uses: actions/upload-artifact@v4
        with:
          name: scan-report-${{ github.run_number }}
          path: |
            artifacts/latest-scan.json
            artifacts/summary.md
            artifacts/trend.json
            artifacts/trend.md
            artifacts/rolling-history.json
            artifacts/rolling-history.md
            artifacts/synthetic-candidate-proof.json
            artifacts/paper-persistence.json
            artifacts/paper-persistence.md
            simulation/results/scanner-plan.json
            simulation/results/atomic-fork-result.json
            simulation/results/scanner-vs-fork.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload candidate report when present
        uses: actions/upload-artifact@v4
        with:
          name: candidate-report-${{ github.run_number }}
          path: artifacts/candidates.json
          if-no-files-found: ignore
          retention-days: 30
