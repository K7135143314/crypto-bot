name: Verify scanner

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck-and-live-read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Read-only Base quote matrix
        run: npm run scan
      - name: Upload scan report
        uses: actions/upload-artifact@v4
        with:
          name: scan-report-${{ github.run_number }}
          path: artifacts/latest-scan.json
          if-no-files-found: error
          retention-days: 30
