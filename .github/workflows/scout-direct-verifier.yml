name: Scout direct verifier

on:
  workflow_dispatch:
  schedule:
    - cron: '12 * * * *'

permissions:
  contents: write

concurrency:
  group: scout-direct-verifier
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run verifier unit tests
        run: npm test
      - name: Verify scout leads directly on-chain
        run: npm run verify:scout
      - name: Save verifier outcomes to central history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p artifacts/central
          for attempt in 1 2 3; do
            git fetch origin observer-data
            git show origin/observer-data:data/intelligence.json > artifacts/central/intelligence.json
            npm run intelligence-history -- artifacts/central/intelligence.json artifacts/scout-verification.json artifacts/central/intelligence.next.json
            git switch --detach origin/observer-data
            cp "$GITHUB_WORKSPACE/artifacts/central/intelligence.next.json" data/intelligence.json
            git add data/intelligence.json
            git commit -m "Update Opportunity Intelligence history" || true
            if git push origin HEAD:observer-data; then
              echo "Central Opportunity Intelligence saved."
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to save central intelligence after three attempts" >&2
              exit 1
            fi
            git switch --detach "$GITHUB_SHA"
            sleep 2
          done
      - name: Publish handoff summary
        run: cat artifacts/scout-verification.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload handoff report
        uses: actions/upload-artifact@v4
        with:
          name: scout-verification-${{ github.run_number }}
          path: |
            artifacts/scout-verification.json
            artifacts/scout-verification.md
          if-no-files-found: error
          retention-days: 30
